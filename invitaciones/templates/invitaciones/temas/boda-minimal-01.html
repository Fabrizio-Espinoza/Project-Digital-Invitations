{% extends "invitaciones/temas/base_interactiva.html" %}
{% load static %}

{% block decoracion_superior %}
<img src="{% static 'invitaciones/img/marco-rosas-diagonal.jpg' %}" class="marco-img" alt="">
{% endblock %}

{% block decoracion_info %}
<img src="{% static 'invitaciones/img/marco-rosas-diagonal.jpg' %}" class="marco-img marco-espejo" alt="">
{% endblock %}

{% block decoracion_inferior %}
{% endblock %}

{% block estilos %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
    /* ============================================
       VARIABLES DE COLOR
       Sacadas del marco "rosas en diagonal": --bg es EXACTAMENTE el crema
       de la imagen, para que el marco se funda con la página sin bordes.
       ============================================ */
    :root {
        --bg: #F5F1E9;
        --bg-fuera: #E7DFD2;
        --texto: #3A322C;
        --terracota: #C0694A;
        --terracota-hover: #A9573A;
        --durazno: #F2C3A4;
        --sauce: #6B7D6C;
        --pampa: #B8997A;
        --linea: #E3D8C8;
        --velo: rgba(245, 241, 233, 0.86);
        --ancho-max: 480px;
    }

    * {
        box-sizing: border-box;
    }

    /* ============================================
       BASE / GENERAL
       En celular la invitación ocupa toda la pantalla. En compu se muestra
       como una "tarjeta" vertical centrada, porque el marco es 9:16 y
       estirado a lo ancho se deformaría o recortaría las flores.
       ============================================ */
    html {
        scroll-snap-type: y mandatory;
        background: var(--bg-fuera);
    }
    body {
        margin: 0 auto;
        max-width: var(--ancho-max);
        background: var(--bg);
        color: var(--texto);
        font-family: 'Jost', sans-serif;
        font-weight: 300;
        text-align: center;
        line-height: 1.6;
        overflow-x: hidden;
        box-shadow: 0 0 60px rgba(58, 50, 44, 0.12);
        -webkit-font-smoothing: antialiased;
    }

    /* ============================================
       SCROLL TIPO "PAGINA POR PAGINA"
       ============================================ */
    .hero,
    .pantalla-info,
    .pantalla-extra,
    .galeria,
    .rsvp {
        scroll-snap-align: start;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    /* ============================================
       ANIMACION DE ENTRADA AL HACER SCROLL
       ============================================ */
    .animar-entrada {
        opacity: 0;
        transform: translateY(18px);
        transition: opacity 0.9s ease, transform 0.9s ease;
    }
    .animar-entrada.visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* ============================================
       MARCO FLORAL (compartido por todas las pantallas)
       La imagen va de fondo con position:absolute; el contenido va encima
       con position:relative + z-index:1. "cover" llena la pantalla completa
       y "marco-espejo" la voltea para que las flores cambien de esquina
       de una pantalla a la siguiente.
       ============================================ */
    .marco-decorativo,
    .marco-decorativo-info {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
    }
    .marco-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .marco-espejo {
        transform: scaleX(-1);
    }

    /* ============================================
       HERO (marco floral + nombres)
       ============================================ */
    .hero {
        position: relative;
        overflow: hidden;
        padding: 40px 24px;
    }
    .hero.visible .marco-img {
        animation: respirar 18s ease-in-out infinite alternate;
    }
    @keyframes respirar {
        from { transform: scale(1); }
        to   { transform: scale(1.05); }
    }
    .hero-contenido {
        position: relative;
        z-index: 1;
        padding: 40px 28px;
    }
    .eyebrow {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.15rem;
        letter-spacing: 1px;
        color: var(--sauce);
        margin: 0 0 6px;
    }
    .nombres {
        font-family: 'Alex Brush', cursive;
        font-weight: 400;
        font-size: clamp(3.4rem, 15vw, 4.6rem);
        color: var(--terracota);
        margin: 0;
        line-height: 1.05;
        text-shadow: 0 2px 12px rgba(245, 241, 233, 0.9);
    }
    /* Ornamento: línea — punto — línea, hecho solo con CSS */
    .nombres::after {
        content: "";
        display: block;
        width: 150px;
        height: 7px;
        margin: 22px auto 0;
        background:
            radial-gradient(circle, var(--pampa) 3px, transparent 3.5px) center / 7px 7px no-repeat,
            linear-gradient(var(--pampa), var(--pampa)) left center / 62px 1px no-repeat,
            linear-gradient(var(--pampa), var(--pampa)) right center / 62px 1px no-repeat;
    }
    .mensaje {
        max-width: 300px;
        margin: 20px auto 0;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1.15rem;
        line-height: 1.5;
        color: var(--texto);
    }
    /* Los textos del hero aparecen uno tras otro */
    .hero .eyebrow,
    .hero .nombres,
    .hero .mensaje {
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 1s ease, transform 1s ease;
    }
    .hero.visible .eyebrow { opacity: 1; transform: none; transition-delay: 0.2s; }
    .hero.visible .nombres { opacity: 1; transform: none; transition-delay: 0.5s; }
    .hero.visible .mensaje { opacity: 1; transform: none; transition-delay: 0.9s; }

    /* ============================================
       PANTALLA 2: tarjeta en forma de arco sobre el marco
       El "velo" crema semitransparente garantiza que el texto se lea
       aunque alguna flor quede detrás en pantallas pequeñas.
       ============================================ */
    .pantalla-info {
        position: relative;
        overflow: hidden;
        padding: 48px 0;
        align-items: center;
    }
    .pantalla-contenido {
        position: relative;
        z-index: 1;
        width: min(86%, 380px);
        padding: 56px 18px 28px;
        background: var(--velo);
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
        border-radius: 190px 190px 20px 20px / 120px 120px 20px 20px;
        outline: 1px solid var(--pampa);
        outline-offset: -8px;
        box-shadow: 0 12px 40px rgba(58, 50, 44, 0.08);
    }

    /* ============================================
       DETALLES (Dia / Hora)
       ============================================ */
    .detalles {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
        padding: 0 10px 14px;
    }
    .detalle-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 100px;
    }
    .detalle-label {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.15rem;
        color: var(--sauce);
    }
    .detalle-valor {
        margin-top: 2px;
        font-size: 0.8rem;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-weight: 400;
    }
    .detalle-divisor {
        width: 1px;
        height: 40px;
        align-self: center;
        background: var(--pampa);
        opacity: 0.6;
    }

    /* ============================================
       LUGARES (Ceremonia / Recepcion)
       ============================================ */
    .lugares {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 12px 28px;
        padding: 14px 10px;
        border-top: 1px solid var(--linea);
    }
    .lugar-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 120px;
        max-width: 160px;
    }

    /* ============================================
       VESTIMENTA
       ============================================ */
    .vestimenta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 14px 10px;
        border-top: 1px solid var(--linea);
    }
    .vestimenta-valor {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .vestimenta-color {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.12);
        box-shadow: 0 0 0 3px var(--bg);
        display: inline-block;
    }

    /* ============================================
       COUNTDOWN
       ============================================ */
    .countdown {
        display: flex;
        justify-content: center;
        gap: 8px;
        padding: 18px 4px;
        border-top: 1px solid var(--linea);
    }
    .countdown div {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 62px;
        padding: 10px 4px 8px;
        border: 1px solid var(--linea);
        border-radius: 999px 999px 10px 10px;
        background: rgba(255, 255, 255, 0.45);
    }
    .countdown span {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
        font-size: clamp(1.7rem, 7vw, 2.2rem);
        color: var(--terracota);
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    .countdown label {
        margin-top: 6px;
        font-size: 0.62rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--sauce);
    }

    /* ============================================
       ACCIONES RAPIDAS (botones circulares)
       ============================================ */
    .acciones-rapidas {
        display: flex;
        justify-content: center;
        gap: 12px;
        padding: 12px 0 0;
        flex-wrap: wrap;
    }
    .accion-icono {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-decoration: none;
        color: var(--texto);
        font-size: 0.66rem;
        letter-spacing: 1px;
        min-width: 76px;
        text-transform: uppercase;
    }
    .icono-circulo {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 1px solid var(--terracota);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--terracota);
        background: rgba(255, 255, 255, 0.5);
        transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }
    .accion-icono:hover .icono-circulo,
    .accion-icono:active .icono-circulo {
        background: var(--terracota);
        color: #fff;
        transform: translateY(-3px);
    }
    .icono-svg {
        width: 22px;
        height: 22px;
        display: block;
    }

    /* ============================================
       PANTALLA EXTRA (Itinerario / Mesa de regalos / Ninos)
       El marco entra como ::before porque esta sección vive en el motor
       y no tiene bloque de decoración propio.
       ============================================ */
    .pantalla-extra {
        position: relative;
        overflow: hidden;
        padding: 80px 32px;
        gap: 32px;
        align-items: center;
    }
    .pantalla-extra::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: url("{% static 'invitaciones/img/marco-rosas-diagonal.jpg' %}") center / cover no-repeat;
        opacity: 0.55;
    }
    .pantalla-extra > * {
        position: relative;
        z-index: 1;
    }
    .itinerario {
        width: 100%;
        max-width: 300px;
        margin: 0 auto;
    }
    .itinerario h3,
    .rsvp h2 {
        font-family: 'Alex Brush', cursive;
        font-weight: 400;
        font-size: 2.8rem;
        line-height: 1.1;
        color: var(--terracota);
        margin: 0 0 18px;
    }
    /* Línea de tiempo vertical con un punto por cada momento */
    .itinerario-item {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        padding: 12px 0 12px 22px;
        font-size: 0.9rem;
        text-align: left;
    }
    .itinerario-item::before {
        content: "";
        position: absolute;
        left: 4px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--pampa);
        opacity: 0.6;
    }
    .itinerario-item::after {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        width: 9px;
        height: 9px;
        margin-top: -4.5px;
        border-radius: 50%;
        background: var(--bg);
        border: 1px solid var(--terracota);
    }
    .itinerario-item:first-of-type::before { top: 50%; }
    .itinerario-item:last-of-type::before { bottom: 50%; }
    .itinerario-hora {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.1rem;
        color: var(--sauce);
        white-space: nowrap;
    }
    .itinerario-evento {
        text-align: right;
    }
    .boton-mesa-regalos {
        display: inline-block;
        padding: 14px 34px;
        border: 1px solid var(--terracota);
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.55);
        color: var(--terracota);
        text-decoration: none;
        font-size: 0.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        transition: background 0.25s ease, color 0.25s ease;
    }
    .boton-mesa-regalos:hover,
    .boton-mesa-regalos:active {
        background: var(--terracota);
        color: #fff;
    }
    .nota-ninos {
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.1rem;
        color: var(--sauce);
        max-width: 280px;
        margin: 0 auto;
    }

    /* ============================================
       GALERIA
       ============================================ */
    .galeria {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        align-content: center;
        gap: 8px;
        padding: 40px 20px;
    }
    .galeria img {
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        border-radius: 999px 999px 6px 6px;
    }
    .galeria img:nth-child(3n + 1) {
        grid-column: span 2;
        aspect-ratio: 4 / 3;
        border-radius: 6px;
    }

    /* ============================================
       RSVP
       ============================================ */
    .rsvp {
        position: relative;
        overflow: hidden;
        padding: 70px 24px;
    }
    .rsvp::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: url("{% static 'invitaciones/img/marco-rosas-diagonal.jpg' %}") center / cover no-repeat;
        transform: scaleX(-1);
        opacity: 0.7;
    }
    .rsvp > * {
        position: relative;
        z-index: 1;
    }
    .rsvp h2 {
        margin-bottom: 4px;
    }
    .rsvp p {
        margin: 0;
        color: var(--sauce);
    }
    #total-confirmados {
        font-family: 'Cormorant Garamond', serif;
        font-weight: 600;
        font-size: 1.2rem;
        color: var(--terracota);
    }
    .fecha-limite {
        margin-top: 4px !important;
        font-family: 'Cormorant Garamond', serif;
        font-size: 1rem;
        font-style: italic;
    }

    /* --- Formulario --- */
    #form-rsvp {
        width: 100%;
        max-width: 380px;
        margin: 26px auto 0;
        padding: 28px 22px;
        background: rgba(255, 255, 255, 0.82);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        border-radius: 16px;
        border: 1px solid var(--linea);
        box-shadow: 0 14px 40px rgba(58, 50, 44, 0.1);
        display: flex;
        flex-direction: column;
        gap: 14px;
    }
    #form-rsvp input,
    #form-rsvp textarea {
        font-family: 'Jost', sans-serif;
        font-size: 1rem; /* 16px evita que iPhone haga zoom al enfocar */
        padding: 12px 14px;
        border: 1px solid var(--linea);
        border-radius: 10px;
        background: var(--bg);
        color: var(--texto);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    #form-rsvp input::placeholder,
    #form-rsvp textarea::placeholder {
        color: #A39A90;
    }
    #form-rsvp input:focus,
    #form-rsvp textarea:focus {
        outline: none;
        border-color: var(--terracota);
        box-shadow: 0 0 0 3px rgba(192, 105, 74, 0.15);
    }
    #form-rsvp textarea {
        resize: vertical;
        min-height: 80px;
    }
    #form-rsvp button {
        font-family: 'Jost', sans-serif;
        font-weight: 400;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-size: 0.85rem;
        padding: 15px;
        border: none;
        border-radius: 30px;
        background: var(--terracota);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(192, 105, 74, 0.3);
        transition: transform 0.15s ease, background 0.2s ease;
    }
    #form-rsvp button:hover {
        background: var(--terracota-hover);
        transform: translateY(-2px);
    }

    /* --- Botones tipo pildora (Si / No / Tal vez) --- */
    .opciones-asistencia {
        display: flex;
        gap: 6px;
    }
    .opciones-asistencia input[type="radio"] {
        position: absolute;
        opacity: 0;
        pointer-events: none;
    }
    .opciones-asistencia label {
        flex: 1;
        text-align: center;
        padding: 10px 6px;
        border: 1px solid var(--linea);
        border-radius: 30px;
        font-size: 0.82rem;
        color: var(--texto);
        background: var(--bg);
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .opciones-asistencia input[type="radio"]:checked + label {
        background: var(--terracota);
        border-color: var(--terracota);
        color: #fff;
    }
    .opciones-asistencia input[type="radio"]:focus-visible + label {
        box-shadow: 0 0 0 3px rgba(192, 105, 74, 0.25);
    }

    /* --- Campo con label visible (acompanantes) --- */
    .campo-con-label {
        display: flex;
        flex-direction: column;
        text-align: left;
    }
    .campo-con-label label {
        font-size: 0.8rem;
        color: var(--sauce);
        margin-bottom: 6px;
    }

    #rsvp-status {
        margin-top: 16px !important;
        font-family: 'Cormorant Garamond', serif;
        font-style: italic;
        font-size: 1.15rem;
        color: var(--terracota) !important;
    }

    /* ============================================
       BOTÓN DE MÚSICA (flotante)
       En compu se alinea al borde de la tarjeta, no al de la ventana.
       Mientras suena, un anillo "late" alrededor.
       ============================================ */
    .boton-musica {
        position: fixed;
        bottom: 20px;
        right: max(20px, calc(50vw - var(--ancho-max) / 2 + 20px));
        z-index: 10;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 1px solid var(--terracota);
        background: var(--velo);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        color: var(--terracota);
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(58, 50, 44, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
    }
    .boton-musica svg {
        width: 22px;
        height: 22px;
    }
    .boton-musica .icono-pausa,
    .boton-musica.sonando .icono-play {
        display: none;
    }
    .boton-musica.sonando .icono-pausa {
        display: block;
    }
    .boton-musica.sonando::after {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: 50%;
        border: 1px solid var(--terracota);
        animation: latido 2s ease-out infinite;
    }
    @keyframes latido {
        from { transform: scale(1);   opacity: 0.7; }
        to   { transform: scale(1.6); opacity: 0; }
    }

    /* ============================================
       ACCESIBILIDAD: menos movimiento si el usuario lo pidió
       ============================================ */
    @media (prefers-reduced-motion: reduce) {
        .hero.visible .marco-img,
        .boton-musica.sonando::after {
            animation: none;
        }
    }
</style>
{% endblock %}
